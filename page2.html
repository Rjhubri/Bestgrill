<!DOCTYPE html>
<html>
<head>
    <title>View Images</title>
</head>
<body>

<h2>Uploaded Images</h2>

<div id="gallery"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
    'https://pqbkbruvsguijelwetxu.supabase.co',
    'sb_publishable_MMZWr_yxGTJAa4avW1bfSA_OqW9Fys3'
);

async function loadImages() {

    const { data, error } = await supabase.storage
        .from('image')
        .list();

    if (error) {
        console.log(error);
        return;
    }

    const gallery = document.getElementById('gallery');

    data.forEach(file => {

        const imageUrl =
            'https://pqbkbruvsguijelwetxu.supabase.co/storage/v1/object/public/images/'
            + file.name;

        gallery.innerHTML += `
            <img src="${imageUrl}"
                 width="250"
                 style="margin:10px;border:1px solid #000;">
        `;
    });
}

loadImages();
</script>

</body>
</html>
