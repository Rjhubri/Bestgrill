<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>

<h2>Signup</h2>

<input type="email" id="semail" placeholder="Email"><br><br>
<input type="password" id="spass" placeholder="Password"><br><br>
<button onclick="signup()">Signup</button>

<hr>

<h2>Login</h2>

<input type="email" id="lemail" placeholder="Email"><br><br>
<input type="password" id="lpass" placeholder="Password"><br><br>
<button onclick="login()">Login</button>

<p id="msg"></p>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
'https://zjmtlbngrnlwgvdaxwnh.supabase.co',
'sb_publishable_WqodO_xHfOSMTRpJdZ73ZA_qnG9_O3z'
)

window.signup = async () => {

const email = document.getElementById('semail').value
const password = document.getElementById('spass').value

const { error } = await supabase.auth.signUp({
email,
password
})

document.getElementById('msg').innerText =
error ? error.message : 'Signup Success'
}

window.login = async () => {

const email = document.getElementById('lemail').value
const password = document.getElementById('lpass').value

const { error } = await supabase.auth.signInWithPassword({
email,
password
})

if(error){
document.getElementById('msg').innerText = error.message
return
}

location.href='page2.html'
}
</script>

</body>
</html>
